<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>TextAlive Test</title>
</head>
<body>
  <h1>TextAlive Test</h1>

  <!-- 状態表示 -->
  <p id="status">読み込み中...</p>

  <!-- 再生ボタン（最初は無効） -->
  <button id="play" disabled>再生</button>

  <script src="https://unpkg.com/textalive-app-api/dist/index.js"></script>
  <script>
    const status = document.getElementById("status");
    const playButton = document.getElementById("play");

    const player = new TextAliveApp.Player({
      app: { token: "lvh8O7GhfpbIUR0v" }
    });

    player.addListener({
      onAppReady: (app) => {
        console.log("App Ready");
        status.textContent = "アプリ準備完了（曲読み込み中...）";

        if (!app.managed) {
          player.createFromSongUrl("https://piapro.jp/t/9xg_");
        }
      },

      onVideoReady: () => {
        console.log("Video Ready");
        status.textContent = "動画読み込み完了！再生できます";
        playButton.disabled = false;
      },

      onError: (e) => {
        console.error("エラー:", e);
        status.textContent = "エラーが発生しました: " + e;
      }
    });

    playButton.onclick = () => {
      console.log("Play button clicked");
      status.textContent = "再生中...";
      player.requestPlay();
    };
  </script>
</body>
</html>
